name: Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag, versions, and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semver tag such as v1.5.0, got $tag" >&2
            exit 1
          fi

          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "scenekit") | .version')"
          if [[ "$workspace_version" != "$version" ]]; then
            echo "Tag $tag does not match workspace version $workspace_version" >&2
            exit 1
          fi

          mismatches="$(cargo metadata --no-deps --format-version 1 | jq -r --arg version "$version" '.packages[] | select(.source == null and .version != $version) | "\(.name)=\(.version)"')"
          if [[ -n "$mismatches" ]]; then
            echo "Workspace package versions do not match $version:" >&2
            echo "$mismatches" >&2
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on origin/main" >&2
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Mesa Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Test all features
        run: cargo test --workspace --all-features

      - name: Test no-default CPU crates
        run: cargo test -p scenekit-math -p scenekit-core -p scenekit-input -p scenekit-scene -p scenekit-camera -p scenekit-mesh -p scenekit-material -p scenekit-light -p scenekit-texture -p scenekit-raycaster -p scenekit-helpers -p scenekit-animato --no-default-features

      - name: Test v1.5 interaction surface
        run: cargo test -p scenekit --test scenekit_v15 --all-features

      - name: Check v1.5 facade feature lanes
        run: |
          cargo check -p scenekit --no-default-features --features interaction
          cargo check -p scenekit --no-default-features --features editor
          cargo check -p scenekit --no-default-features --features egui

      - name: Check all examples
        run: cargo check -p scenekit --examples --all-features

      - name: Check scenekit-wasm
        run: cargo check -p scenekit-wasm --target wasm32-unknown-unknown --all-features

      - name: Test renderer and post GPU paths
        run: cargo test -p scenekit-renderer -p scenekit-post --all-features
        env:
          SCENEKIT_RUN_GPU_TESTS: "1"
          WGPU_BACKEND: vulkan

      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Package crates
        run: cargo package --workspace --no-verify

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_crate() {
            crate="$1"
            log="publish-${crate}.log"

            cargo package -p "$crate" --no-verify

            for attempt in 1 2 3 4 5; do
              set +e
              cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee "$log"
              status="${PIPESTATUS[0]}"
              set -e

              if [[ "$status" -eq 0 ]]; then
                return 0
              fi

              if grep -Eiq "already uploaded|already exists|crate version .* is already uploaded" "$log"; then
                echo "$crate is already published for this version; continuing."
                return 0
              fi

              if grep -Eiq "failed to select a version|no matching package named|perhaps a crate was updated and forgotten" "$log" && [[ "$attempt" -lt 5 ]]; then
                echo "crates.io index has not caught up for $crate; retrying in 60 seconds."
                sleep 60
                continue
              fi

              echo "Publishing $crate failed." >&2
              exit "$status"
            done
          }

          for crate in \
            scenekit-math \
            scenekit-core \
            scenekit-input \
            scenekit-scene \
            scenekit-camera \
            scenekit-mesh \
            scenekit-material \
            scenekit-light \
            scenekit-texture \
            scenekit-loader \
            scenekit-post \
            scenekit-renderer \
            scenekit-raycaster \
            scenekit-helpers \
            scenekit-animato \
            scenekit-wasm \
            scenekit
          do
            publish_crate "$crate"
            if [[ "$crate" != "scenekit" ]]; then
              sleep 30
            fi
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, publish]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "scenekit v${{ needs.verify.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
