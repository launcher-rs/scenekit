[package]
name = "scenekit-wasm"
description = "scenekit 的浏览器/WASM 渲染器封装和 DOM 输入辅助工具。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = [
    "scenekit-camera/std",
    "scenekit-core/std",
    "scenekit-input/std",
    "scenekit-light/std",
    "scenekit-material/std",
    "scenekit-math/std",
    "scenekit-mesh/std",
    "scenekit-helpers/std",
    "scenekit-raycaster/std",
    "scenekit-animato/std",
    "scenekit-renderer/std",
    "scenekit-scene/std",
    "scenekit-core/inspector",
    "scenekit-core/serde",
    "scenekit-scene/inspector",
    "dep:serde_json",
]
serde = [
    "scenekit-camera/serde",
    "scenekit-core/serde",
    "scenekit-input/serde",
    "scenekit-light/serde",
    "scenekit-material/serde",
    "scenekit-math/serde",
    "scenekit-mesh/serde",
    "scenekit-helpers/serde",
    "scenekit-raycaster/serde",
    "scenekit-animato/serde",
    "scenekit-renderer/serde",
    "scenekit-scene/serde",
]

[dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
scenekit-camera = { workspace = true }
scenekit-core = { workspace = true }
scenekit-input = { workspace = true }
scenekit-light = { workspace = true }
scenekit-material = { workspace = true }
scenekit-math = { workspace = true }
scenekit-mesh = { workspace = true }
scenekit-helpers = { workspace = true }
scenekit-raycaster = { workspace = true }
scenekit-animato = { workspace = true }
scenekit-renderer = { workspace = true }
scenekit-scene = { workspace = true }
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Gamepad",
    "GamepadButton",
    "Navigator",
    "PointerEvent",
    "Touch",
    "TouchEvent",
    "WebGlBuffer",
    "WebGl2RenderingContext",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "Window",
    "WheelEvent",
    "console",
] }

[[test]]
name = "wasm"
path = "../../tests/wasm.rs"
