[package]
name = "scenekit-raycaster"
description = "scenekit 的 CPU 端 BVH 光线投射和场景拾取。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = [
    "scenekit-camera/std",
    "scenekit-core/std",
    "scenekit-math/std",
    "scenekit-mesh/std",
    "scenekit-scene/std",
]
serde = [
    "dep:serde",
    "scenekit-camera/serde",
    "scenekit-core/serde",
    "scenekit-math/serde",
    "scenekit-mesh/serde",
    "scenekit-scene/serde",
]

[dependencies]
scenekit-camera = { workspace = true }
scenekit-core = { workspace = true }
scenekit-math = { workspace = true }
scenekit-mesh = { workspace = true }
scenekit-scene = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "bvh_bench"
path = "../../benches/bvh_bench.rs"
harness = false

[[test]]
name = "raycaster"
path = "../../tests/raycaster.rs"
