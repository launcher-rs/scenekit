[package]
name = "scenekit-scene"
description = "scenekit 的无 GPU 场景图、节点、变换、雾、精灵和 LOD 辅助工具。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["scenekit-math/std", "scenekit-core/std", "slotmap/std"]
serde = ["dep:serde", "scenekit-math/serde", "scenekit-core/serde"]
inspector = ["scenekit-core/inspector"]

[dependencies]
scenekit-core = { workspace = true }
scenekit-math = { workspace = true }
serde = { workspace = true, optional = true }
slotmap = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "scene_graph_bench"
path = "../../benches/scene_graph_bench.rs"
harness = false

[[test]]
name = "scene_graph"
path = "../../tests/scene_graph.rs"

[[test]]
name = "scene_serde"
path = "../../tests/scene_serde.rs"
