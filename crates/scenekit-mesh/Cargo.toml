[package]
name = "scenekit-mesh"
description = "scenekit 的 CPU 端几何体、网格、图元、变形、实例化和批处理类型。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["scenekit-core/std", "scenekit-math/std"]
serde = ["dep:serde", "scenekit-core/serde", "scenekit-math/serde"]

[dependencies]
scenekit-core = { workspace = true }
scenekit-math = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "mesh_gen_bench"
path = "../../benches/mesh_gen_bench.rs"
harness = false

[[test]]
name = "mesh_geometry"
path = "../../tests/mesh_geometry.rs"

[[test]]
name = "mesh_primitives"
path = "../../tests/mesh_primitives.rs"

[[test]]
name = "mesh_serde"
path = "../../tests/mesh_serde.rs"
