[package]
name = "scenekit-material"
description = "GPU-free material traits, pipeline keys, and built-in material types for scenekit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["scenekit-core/std", "scenekit-math/std"]
serde = ["dep:serde", "scenekit-core/serde", "scenekit-math/serde"]
inspector = ["scenekit-core/inspector"]

[dependencies]
scenekit-core = { workspace = true }
scenekit-math = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "material_pipeline"
path = "../../tests/material_pipeline.rs"

[[test]]
name = "material_serde"
path = "../../tests/material_serde.rs"
