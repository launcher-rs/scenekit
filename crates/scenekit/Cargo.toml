[package]
name = "scenekit"
description = "scenekit 渲染器 API 的门面 crate。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
default = ["std", "scene", "camera", "mesh", "material", "light", "texture", "raycaster", "helpers"]
std = ["scenekit-math/std", "scenekit-core/std", "scenekit-input/std", "scenekit-scene?/std", "scenekit-camera?/std", "scenekit-mesh?/std", "scenekit-material?/std", "scenekit-light?/std", "scenekit-texture?/std", "scenekit-loader?/std", "scenekit-post?/std", "scenekit-renderer?/std", "scenekit-raycaster?/std", "scenekit-helpers?/std", "scenekit-animato?/std", "scenekit-wasm?/std"]
scene = ["dep:scenekit-scene"]
camera = ["dep:scenekit-camera"]
mesh = ["dep:scenekit-mesh"]
material = ["dep:scenekit-material"]
light = ["dep:scenekit-light"]
texture = ["dep:scenekit-texture"]
loader = ["dep:scenekit-loader"]
post = ["dep:scenekit-post", "scenekit-renderer?/post"]
renderer = ["dep:scenekit-renderer"]
raycaster = ["dep:scenekit-raycaster"]
helpers = ["dep:scenekit-helpers"]
interaction = ["scene", "camera", "raycaster", "helpers"]
editor = [
    "std",
    "interaction",
    "material",
    "light",
    "texture",
    "scenekit-core/inspector",
    "scenekit-scene/inspector",
    "scenekit-camera/inspector",
    "scenekit-material/inspector",
    "scenekit-light/inspector",
    "scenekit-texture/inspector",
    "scenekit-animato?/inspector",
    "scenekit-renderer?/inspector",
]
egui = ["editor", "scenekit-helpers/egui"]
animato = ["dep:scenekit-animato"]
wasm = ["dep:scenekit-wasm"]
libm = ["scenekit-math/libm"]
serde = ["scenekit-math/serde", "scenekit-core/serde", "scenekit-input/serde", "scenekit-scene?/serde", "scenekit-camera?/serde", "scenekit-mesh?/serde", "scenekit-material?/serde", "scenekit-light?/serde", "scenekit-texture?/serde", "scenekit-loader?/serde", "scenekit-post?/serde", "scenekit-renderer?/serde", "scenekit-raycaster?/serde", "scenekit-helpers?/serde", "scenekit-animato?/serde", "scenekit-wasm?/serde"]
approx = ["scenekit-math/approx"]
gpu = ["scenekit-core/gpu"]

[dependencies]
scenekit-core = { workspace = true }
scenekit-input = { workspace = true }
scenekit-math = { workspace = true }
scenekit-camera = { workspace = true, optional = true }
scenekit-light = { workspace = true, optional = true }
scenekit-loader = { workspace = true, optional = true }
scenekit-material = { workspace = true, optional = true }
scenekit-mesh = { workspace = true, optional = true }
scenekit-post = { workspace = true, optional = true }
scenekit-raycaster = { workspace = true, optional = true }
scenekit-renderer = { workspace = true, optional = true }
scenekit-scene = { workspace = true, optional = true }
scenekit-texture = { workspace = true, optional = true }
scenekit-helpers = { workspace = true, optional = true }
scenekit-animato = { workspace = true, optional = true }
scenekit-wasm = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true }
pollster = { workspace = true }

