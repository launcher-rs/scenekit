name = "scenekit_foundation"
path = "../../tests/scenekit_foundation.rs"

[[test]]
name = "animation_runtime"
path = "../../tests/animation_runtime.rs"
required-features = ["animato", "loader", "scene", "camera", "material", "light", "mesh", "helpers"]

